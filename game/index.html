<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F8F1E5" />
  <meta name="description" content="Change one letter at a time to build the longest word chain you can. Race the clock — 60 seconds to score big." />
  <title>Soar Boar — the word-chaining game</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐷</text></svg>" />

  <!-- Open Graph / social -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Soar Boar — the word-chaining game" />
  <meta property="og:description" content="Change one letter at a time to build the longest word chain you can. Race the clock — 60 seconds to score big." />
  <meta property="og:url" content="https://soarboar.com" />
  <meta property="og:image" content="https://soarboar.com/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="1200" />
  <meta property="og:image:alt" content="Soar Boar — a flying pig" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Soar Boar — the word-chaining game" />
  <meta name="twitter:description" content="Change one letter at a time to build the longest word chain you can." />
  <meta name="twitter:image" content="https://soarboar.com/og-image.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Instrument+Serif:ital@0;1&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream:      #F8F1E5;
      --orange:     #EC694A;
      --pink:       rgba(236,105,74,0.12);
      --white:      #FFFFFF;
      --dark:       #0A0A0A;
      --muted:      #737373;
      --border:     rgba(0,0,0,0.08);
      --error:      #C0392B;
      --ok:         #27AE60;
      --pos1:       #F48870;
      --pos2:       #9B59B6;
      --pos3:       #2E86C1;
      --pos4:       #27AE60;
      --ff:         'DM Sans', system-ui, sans-serif;
      --ff-serif:   'Instrument Serif', Georgia, serif;
      --ff-sans:    'Instrument Sans', system-ui, sans-serif;
      /* Brand "deep" colors — pig SVG fill, bean SVG fill, and the
         wordmark accent are all driven by these tokens so they
         can't drift apart. */
      --deep-peach: #EC694A;
      --deep-sage:  #27885E;
      --accent:     var(--deep-peach);
      /* Tutorial uses a separate "guidance" color so the arrow / changed-ok
         pills don't clash with the mode accent. Default cream bg → blue.
         When coloredBg is on, falls through to --accent for visual cohesion. */
      --tutorial-accent:      #4a90d9;
      --tutorial-accent-soft: rgba(134,187,239,0.18);
      --tutorial-accent-bg:   #EEF5FD;
      /* Motion */
      --ease-out:    cubic-bezier(0.2, 0.8, 0.2, 1);
      --ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --dur-fast:    150ms;
      --dur-base:    220ms;
      --dur-slow:    320ms;
    }

    body {
      background: var(--cream);
      color: var(--dark);
      font-family: var(--ff);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overscroll-behavior-y: none;
    }

    /* ── Animations ─────────────────────────────────────── */
    @keyframes wiggle {
      0%, 100% { transform: rotate(0deg); }
      25%       { transform: rotate(-3deg); }
      75%       { transform: rotate(3deg); }
    }
    @keyframes earFlap {
      0%   { transform: translateY(0)    scaleY(1);    }
      18%  { transform: translateY(-5px) scaleY(0.93); }
      38%  { transform: translateY(2px)  scaleY(1.04); }
      58%  { transform: translateY(-3px) scaleY(0.97); }
      78%  { transform: translateY(1px)  scaleY(1.01); }
      100% { transform: translateY(0)    scaleY(1);    }
    }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(5px); }
    }
    @keyframes tileAccept {
      0%  { transform: scale(1); }
      40% { transform: scale(1.2); }
      70% { transform: scale(0.93); }
      100%{ transform: scale(1); }
    }
    @keyframes tileSuccess {
      0%  { transform: scale(1) rotate(0deg); }
      25% { transform: scale(1.25) rotate(-6deg); }
      50% { transform: scale(1.25) rotate(6deg); }
      75% { transform: scale(1.1) rotate(-3deg); }
      100%{ transform: scale(1) rotate(0deg); }
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; } to { opacity: 1; }
    }
    @keyframes countdownPop {
      0%  { transform: scale(0.5); opacity: 0; }
      60% { transform: scale(1.12); opacity: 1; }
      100%{ transform: scale(1); opacity: 1; }
    }
    @keyframes successBounce {
      0%  { transform: scale(0.8) translateY(10px); opacity: 0; }
      60% { transform: scale(1.06) translateY(-4px); opacity: 1; }
      100%{ transform: scale(1) translateY(0); opacity: 1; }
    }
    @keyframes confettiFall {
      0%  { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100%{ transform: translateY(60px) rotate(360deg); opacity: 0; }
    }
    /* Gentle staggered entrance — each direct child of .stagger
       rises 8px and fades in, ~60ms apart. Respects reduced-motion. */
    @keyframes riseIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: none; }
    }
    .stagger > * {
      animation: riseIn 380ms var(--ease-out) both;
    }
    .stagger > *:nth-child(1) { animation-delay: 0ms;   }
    .stagger > *:nth-child(2) { animation-delay: 60ms;  }
    .stagger > *:nth-child(3) { animation-delay: 110ms; }
    .stagger > *:nth-child(4) { animation-delay: 160ms; }
    .stagger > *:nth-child(5) { animation-delay: 210ms; }
    .stagger > *:nth-child(6) { animation-delay: 250ms; }
    .stagger > *:nth-child(7) { animation-delay: 290ms; }
    .stagger > *:nth-child(n+8) { animation-delay: 320ms; }

    /* Emoji burst from new-personal-best banner */
    @keyframes emojiBurst {
      0%   { transform: translate(-50%, -50%) rotate(0deg) scale(0.4); opacity: 0; }
      18%  { opacity: 1; }
      100% {
        transform:
          translate(calc(-50% + var(--burst-dx)), calc(-50% + var(--burst-dy)))
          rotate(var(--burst-rot))
          scale(0.85);
        opacity: 0;
      }
    }

    .shake { animation: shake 240ms ease; }

    /* ── Soy Boy green theme ─────────────────────────────── */
    .soyboy { --orange: #27885E; --accent: var(--deep-sage); }

    /* ── Design experiments — driven by data attrs on <html> ── */

    /* Colored backgrounds per mode (debug toggle).
       data-exp-colored-bg is only set when the start screen is active —
       game/end screens always render on cream. */
    :root[data-exp-colored-bg="1"][data-exp-mode="classic"] {
      --cream: #FFD1A8;             /* picked peach */
      --muted: rgba(0,0,0,0.62);
      --border: rgba(0,0,0,0.16);
      --accent: var(--deep-peach);
      --accent-soft: rgba(236,105,74,0.14);
    }
    :root[data-exp-colored-bg="1"][data-exp-mode="soyboy"]  {
      --cream: #B7D197;             /* picked sage */
      --muted: rgba(0,0,0,0.62);
      --border: rgba(0,0,0,0.16);
      --accent: var(--deep-sage);
      --accent-soft: rgba(39,136,94,0.14);
    }
    /* Dark mode variants — deep saturated bgs with lighter accents for contrast */
    :root[data-theme="dark"][data-exp-colored-bg="1"][data-exp-mode="classic"] {
      --cream: #3A1F18;
      --muted: rgba(255,255,255,0.72);
      --border: rgba(255,255,255,0.16);
      --accent: #F49780;
      --accent-soft: rgba(244,151,128,0.18);
    }
    :root[data-theme="dark"][data-exp-colored-bg="1"][data-exp-mode="soyboy"]  {
      --cream: #1C2823;
      --muted: rgba(255,255,255,0.72);
      --border: rgba(255,255,255,0.16);
      --accent: #58BB8B;
      --accent-soft: rgba(88,187,139,0.18);
    }
    /* Dark cream (regular dark mode, no coloredBg) gets lighter accents
       so the wordmark accent stays readable on dark cream. */
    :root[data-theme="dark"] { --accent: #F49780; }
    :root[data-theme="dark"] .soyboy { --accent: #58BB8B; }

    /* Surfaces on colored bg — translucent cream tint reads cleanly on saturated bgs.
       Higher opacity = cleaner cream-on-color, less muddy mix. */
    :root[data-exp-colored-bg="1"] .info-card,
    :root[data-exp-colored-bg="1"] .mode-pill {
      background: rgba(255,251,246,0.74);
      border-color: rgba(0,0,0,0.10);
      color: var(--dark);
    }
    :root[data-theme="dark"][data-exp-colored-bg="1"] .info-card,
    :root[data-theme="dark"][data-exp-colored-bg="1"] .mode-pill {
      background: rgba(255,255,255,0.10);
      border-color: rgba(255,255,255,0.14);
    }
    :root[data-exp-colored-bg="1"] .info-card-title,
    :root[data-exp-colored-bg="1"] .info-list-text { color: var(--dark); }
    :root[data-exp-colored-bg="1"] .info-num { background: var(--accent-soft); color: var(--accent); }
    :root[data-exp-colored-bg="1"] .mode-pill:hover:not(.active) { background: rgba(255,251,246,0.92); }
    :root[data-exp-colored-bg="1"] .mode-pill.active {
      background: #1A1918;
      color: #fff;
      border-color: #1A1918;
    }
    :root[data-theme="dark"][data-exp-colored-bg="1"] .mode-pill.active {
      background: #F5F3F0;
      color: #1A1918;
      border-color: #F5F3F0;
    }

    /* Primary CTA → dark pill on colored bg (orange clashes with warm bg) */
    :root[data-exp-colored-bg="1"] .btn-primary { background: #1A1918; color: #fff; }
    :root[data-exp-colored-bg="1"] .btn-primary:hover { filter: brightness(1.18); }
    :root[data-theme="dark"][data-exp-colored-bg="1"] .btn-primary { background: #F5F3F0; color: #1A1918; }
    :root[data-theme="dark"][data-exp-colored-bg="1"] .btn-primary:hover { filter: brightness(0.92); }
    /* Ghost button on colored bg — cream tint, dark readable text */
    :root[data-exp-colored-bg="1"] .btn-ghost {
      color: var(--dark);
      background: rgba(255,251,246,0.62);
      border-color: rgba(0,0,0,0.16);
    }
    :root[data-exp-colored-bg="1"] .btn-ghost:hover {
      background: rgba(255,251,246,0.88);
      border-color: rgba(0,0,0,0.22);
      color: var(--dark);
    }
    :root[data-theme="dark"][data-exp-colored-bg="1"] .btn-ghost {
      color: var(--dark);
      background: rgba(255,255,255,0.08);
      border-color: rgba(255,255,255,0.16);
    }
    :root[data-theme="dark"][data-exp-colored-bg="1"] .btn-ghost:hover {
      background: rgba(255,255,255,0.14);
    }
    /* Best-chip on colored bg */
    :root[data-exp-colored-bg="1"] .best-chip { color: var(--dark); }
    :root[data-exp-colored-bg="1"] .best-chip strong { color: var(--accent); }

    /* Mascot fills now live in the SVG itself (deep peach / deep sage),
       so no CSS filter needed on coloredBg. */

    :root[data-exp-colored-bg="1"] .simple-tag { color: var(--muted); }

    /* Simplified Tiles-style landing */
    .simple-start { padding-top: 4vh; }
    .simple-segmented-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 8vh;
    }
    .mode-segmented {
      display: inline-flex;
      background: rgba(0,0,0,0.05);
      border-radius: 999px;
      padding: 4px;
      gap: 2px;
    }
    .seg-tab {
      display: inline-flex;
      align-items: center;
      padding: 10px 20px;
      border: none;
      background: transparent;
      border-radius: 999px;
      font-family: var(--ff-sans);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: var(--muted);
      cursor: pointer;
      touch-action: manipulation;
      transition:
        background var(--dur-base) var(--ease-out),
        color var(--dur-base) var(--ease-out),
        transform 100ms var(--ease-out);
      min-height: 40px;
    }
    .seg-tab:active { transform: scale(0.96); }
    .seg-tab.active {
      background: var(--dark);
      color: var(--cream);
    }
    :root[data-exp-colored-bg="1"] .mode-segmented { background: rgba(255,251,246,0.68); }
    :root[data-exp-colored-bg="1"] .seg-tab.active { background: #1A1918; color: #fff; }
    :root[data-exp-colored-bg="1"] .seg-tab:not(.active) { color: rgba(0,0,0,0.62); }
    :root[data-theme="dark"][data-exp-colored-bg="1"] .mode-segmented { background: rgba(0,0,0,0.32); }
    :root[data-theme="dark"][data-exp-colored-bg="1"] .seg-tab.active { background: #F5F3F0; color: #1A1918; }
    :root[data-theme="dark"][data-exp-colored-bg="1"] .seg-tab:not(.active) { color: rgba(255,255,255,0.72); }

    .simple-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .simple-wordmark {
      font-family: var(--ff-serif);
      font-size: 56px;
      font-weight: 600;
      letter-spacing: 0;
      line-height: 1;
      text-align: center;
      margin-top: 4px;
    }
    .simple-wordmark .accent {
      color: var(--accent);
      font-family: inherit;
      font-weight: inherit;
      font-style: inherit;
    }
    .simple-tag {
      font-family: var(--ff-sans);
      font-size: 17px;
      color: var(--muted);
      text-align: center;
      max-width: 22ch;
      line-height: 1.4;
      margin-top: 4px;
    }
    :root[data-exp-colored-bg="1"] .simple-tag { color: rgba(0,0,0,0.66); }
    /* Smaller meta sub-line under the tagline — same family, lighter */
    .simple-tag-meta {
      display: inline-block;
      margin-top: 4px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.02em;
      opacity: 0.78;
    }
    .simple-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 36px;
    }
    .simple-footer {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-top: 22px;
    }
    .simple-link {
      background: none; border: none; padding: 10px 4px;
      font-family: var(--ff-sans);
      font-size: 13px; font-weight: 600;
      color: var(--muted); cursor: pointer;
      letter-spacing: 0.02em;
      transition: color var(--dur-fast) var(--ease-out);
    }
    .simple-link:hover { color: var(--dark); }
    :root[data-exp-colored-bg="1"] .simple-link { color: rgba(0,0,0,0.55); }
    :root[data-exp-colored-bg="1"] .simple-link:hover { color: #1A1918; }
    .simple-credit {
      margin-top: 36px;
      text-align: center;
      font-family: var(--ff-sans);
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      opacity: 0.7;
    }
    @media (min-width: 640px) {
      .simple-wordmark { font-size: 80px; }
      .simple-tag { font-size: 20px; }
    }

    /* ── Debug badge — visible only when debug mode is on ── */
    .debug-badge {
      position: fixed;
      top: max(12px, env(safe-area-inset-top, 0px));
      right: 12px;
      background: rgba(0,0,0,0.78);
      color: #FFA86F;
      font-family: var(--ff-sans);
      font-size: 10px; font-weight: 700;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      padding: 5px 10px;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      z-index: 1001;
      opacity: 0.5;
      transition: opacity 150ms var(--ease-out), transform 100ms var(--ease-out);
      touch-action: manipulation;
    }
    .debug-badge:hover  { opacity: 1; }
    .debug-badge:active { transform: scale(0.94); }

    /* ── Floating Color Picker ─────────────────────────── */
    .cp-fab {
      position: fixed;
      right: 16px; bottom: 16px;
      width: 52px; height: 52px;
      border-radius: 999px;
      border: none;
      background: #1A1918;
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      z-index: 1000;
      box-shadow: 0 6px 20px rgba(0,0,0,0.18);
      transition: transform 120ms var(--ease-out);
      touch-action: manipulation;
    }
    .cp-fab:hover  { transform: scale(1.06); }
    .cp-fab:active { transform: scale(0.95); }
    .cp-floating {
      position: fixed;
      right: 16px; bottom: 16px;
      width: 296px;
      background: #fff;
      color: #1A1918;
      border-radius: 18px;
      padding: 16px;
      z-index: 1000;
      box-shadow: 0 12px 40px rgba(0,0,0,0.22);
      font-family: var(--ff-sans);
    }
    :root[data-theme="dark"] .cp-floating { background: #2A2826; color: #F5F3F0; }
    .cp-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px;
    }
    .cp-title {
      font-size: 13px; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase;
      opacity: 0.6;
    }
    .cp-close {
      width: 30px; height: 30px;
      border-radius: 999px;
      border: none;
      background: rgba(0,0,0,0.06);
      cursor: pointer;
      font-size: 18px; line-height: 1;
      display: inline-flex; align-items: center; justify-content: center;
      color: inherit;
    }
    :root[data-theme="dark"] .cp-close { background: rgba(255,255,255,0.1); }
    .cp-close:hover { background: rgba(0,0,0,0.10); }
    .cp-swatches {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 12px;
    }
    .cp-swatch {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 10px;
      border: 1.5px solid transparent;
      background: rgba(0,0,0,0.04);
      border-radius: 10px;
      cursor: pointer;
      font-family: inherit;
      transition: border-color 150ms var(--ease-out), background 150ms var(--ease-out);
      text-align: left;
    }
    :root[data-theme="dark"] .cp-swatch { background: rgba(255,255,255,0.06); }
    .cp-swatch.active { border-color: currentColor; }
    .cp-swatch-color {
      width: 22px; height: 22px;
      border-radius: 6px;
      border: 1px solid rgba(0,0,0,0.18);
      flex-shrink: 0;
    }
    .cp-swatch-text {
      display: flex; flex-direction: column;
      line-height: 1.2;
      min-width: 0;
    }
    .cp-swatch-label { font-size: 11px; font-weight: 600; opacity: 0.62; }
    .cp-swatch-hex {
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 11px; font-weight: 600;
      letter-spacing: -0.02em;
    }

    /* HSV picker — drag-to-pick SL pad + hue slider + hex input */
    .hsv-pad {
      position: relative;
      width: 100%; height: 132px;
      border-radius: 10px;
      cursor: crosshair;
      touch-action: none;
      user-select: none;
    }
    .hsv-pad-marker {
      position: absolute;
      width: 14px; height: 14px;
      border: 2px solid #fff;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.45), 0 1px 4px rgba(0,0,0,0.25);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .hsv-hue {
      position: relative;
      width: 100%; height: 14px;
      margin-top: 12px;
      border-radius: 999px;
      cursor: ew-resize;
      touch-action: none;
      user-select: none;
      background: linear-gradient(to right,
        hsl(0,100%,50%), hsl(60,100%,50%), hsl(120,100%,50%),
        hsl(180,100%,50%), hsl(240,100%,50%), hsl(300,100%,50%), hsl(360,100%,50%));
    }
    .hsv-hue-marker {
      position: absolute;
      top: 50%;
      width: 14px; height: 18px;
      margin-left: -7px;
      margin-top: -9px;
      border: 2px solid #fff;
      border-radius: 4px;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.45), 0 1px 4px rgba(0,0,0,0.25);
      pointer-events: none;
      background: transparent;
    }
    .hsv-hex-row {
      display: flex; gap: 8px; align-items: center;
      margin-top: 12px;
    }
    .hsv-hex {
      flex: 1;
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 13px;
      padding: 8px 10px;
      border: 1px solid rgba(0,0,0,0.14);
      border-radius: 8px;
      background: rgba(0,0,0,0.02);
      color: inherit;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    :root[data-theme="dark"] .hsv-hex {
      background: rgba(255,255,255,0.05);
      border-color: rgba(255,255,255,0.14);
    }
    .hsv-hex:focus { outline: 2px solid currentColor; outline-offset: 1px; }
    .cp-actions {
      display: flex; gap: 8px; margin-top: 12px;
    }
    .cp-btn {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid rgba(0,0,0,0.12);
      background: rgba(0,0,0,0.04);
      border-radius: 999px;
      font-family: inherit;
      font-size: 12px; font-weight: 600;
      cursor: pointer;
      color: inherit;
    }
    :root[data-theme="dark"] .cp-btn {
      background: rgba(255,255,255,0.06);
      border-color: rgba(255,255,255,0.14);
    }
    .cp-btn:hover { background: rgba(0,0,0,0.08); }
    .cp-btn.primary {
      background: #1A1918; color: #fff;
      border-color: #1A1918;
    }
    :root[data-theme="dark"] .cp-btn.primary {
      background: #F5F3F0; color: #1A1918; border-color: #F5F3F0;
    }
    .cp-btn.primary:hover { filter: brightness(1.2); }

    /* Dark pill primary used in simple landing */
    .btn-dark { background: #1A1918; color: #fff; }
    .btn-dark:hover { filter: brightness(1.18); }
    .btn-dark:active { filter: brightness(0.95); }
    :root[data-theme="dark"] .btn-dark { background: #F5F3F0; color: #1A1918; }
    :root[data-theme="dark"] .btn-dark:hover { filter: brightness(0.94); }

    /* ── Root ────────────────────────────────────────────── */
    #root {
      width: 100%;
      max-width: 420px;
      /* safe-area-inset-top handles notch/Dynamic Island; bottom handles home indicator */
      padding: env(safe-area-inset-top, 0) 20px calc(24px + env(safe-area-inset-bottom, 0));
      display: flex;
      flex-direction: column;
      /* Prevents dark/light background bleed-through during screen fade transitions */
      background: var(--cream);
    }
    @media (min-width: 640px) {
      #root { max-width: 560px; }
    }

    /* ── Header ──────────────────────────────────────────── */
    .hdr {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px; /* mascot SVGs include transparent padding — keep tight */
      padding: 16px 0 0;
      cursor: pointer;
      transition: opacity var(--dur-fast) var(--ease-out);
      border-radius: 12px;
    }
    @media (min-width: 640px) { .hdr { gap: 10px; } }
    .hdr:hover { opacity: 0.85; }
    .hdr:focus-visible { outline-offset: 4px; }
    .wordmark {
      font-family: var(--ff-serif);
      font-size: 40px;
      font-weight: 600;
      letter-spacing: 0;
      line-height: 1;
      margin-top: 2px; /* optical alignment with mascot SVG */
    }
    /* Use spans + .accent for the colored word so both halves render with
       identical font metrics (em was producing weight asymmetries via
       browser bold-synthesis on the italic glyph forms). */
    .wordmark .accent {
      color: var(--accent);
      font-family: inherit;
      font-weight: inherit;
      font-style: inherit;
    }

    /* ── Card ────────────────────────────────────────────── */
    .card {
      background: var(--white);
      border-radius: 24px;
      padding: 24px;
    }

    /* ── Buttons ─────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: var(--ff-sans);
      font-weight: 600;
      font-size: 17px;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      padding: 15px 24px;
      transition:
        transform 100ms var(--ease-out),
        filter var(--dur-fast) var(--ease-out),
        background-color var(--dur-fast) var(--ease-out),
        opacity var(--dur-fast) var(--ease-out);
      line-height: 1;
      touch-action: manipulation; /* prevent double-tap zoom delay */
      min-height: 48px;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--orange); color: #fff; }
    .btn-primary:hover { filter: brightness(1.05); }
    .btn-primary:active { filter: brightness(0.96); }
    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      font-weight: 600;
    }
    .btn-ghost:hover { color: var(--dark); background: rgba(0,0,0,0.03); border-color: rgba(0,0,0,0.14); }
    .btn-ghost:active { background: rgba(0,0,0,0.05); }
    :root[data-theme="dark"] .btn-ghost:hover { background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.18); }
    :root[data-theme="dark"] .btn-ghost:active { background: rgba(255,255,255,0.07); }
    .btn-full { width: 100%; }
    .btn-sm { font-size: 13px; padding: 10px 18px; border-radius: 999px; min-height: 44px; }
    .btn-copy {
      background: #1A1918;
      color: #F5F3F0;
    }
    .btn-copy:hover { filter: brightness(1.18); }
    :root[data-theme="dark"] .btn-copy {
      background: #2E2B28;
      color: #F5F3F0;
    }

    /* ── Section label ───────────────────────────────────── */
    .section-label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    /* ── Timer ───────────────────────────────────────────── */
    .timer-wrap { margin-top: 20px; }
    .timer-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 6px;
    }
    .timer-label { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: 0.01em; }
    .timer-secs  { font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .timer-secs.urgent { color: var(--error); }
    .timer-track { height: 6px; background: var(--border); border-radius: 999px; overflow: hidden; }
    .timer-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--orange);
      transition: width 1s linear, background 0.3s;
    }
    .timer-fill.urgent { background: var(--error); animation: timerPulse 800ms ease-in-out infinite; }
    .timer-fill.paused { background: var(--border); transition: none; }
    @keyframes timerPulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.5; }
    }
    .timer-track.urgent { box-shadow: 0 0 0 2px rgba(192,57,43,0.18); }

    /* ── Tile ────────────────────────────────────────────── */
    .tile-row { display: flex; gap: 8px; justify-content: center; }
    .tile {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      border: 1.5px solid rgba(0,0,0,0.18); /* thinner + higher contrast for a contemporary feel */
      background: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 800;
      color: var(--dark);
      user-select: none;
      transition: border-color 100ms, background 100ms, color 100ms;
    }
    .tile.cursor { border-color: var(--dark); }
    .tile.accept { animation: tileAccept 280ms var(--ease-spring) both; }
    .tile.success-anim { animation: tileSuccess 500ms var(--ease-spring) both; }
    /* wrong: too many letters changed */
    .tile.wrong {
      border-color: var(--error);
      background: #FEF0EE;
      color: var(--error);
    }
    /* success highlight on onboarding */
    .tile.changed-ok {
      border-color: var(--tutorial-accent);
      background: var(--tutorial-accent-bg);
      color: var(--tutorial-accent);
    }
    /* On colored bg, use the mode accent so tutorial highlights stay readable */
    :root[data-exp-colored-bg="1"] {
      --tutorial-accent:      var(--accent);
      --tutorial-accent-soft: var(--accent-soft);
      --tutorial-accent-bg:   var(--accent-soft);
    }

    /* ── Input hint ──────────────────────────────────────── */
    .input-hint {
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      margin-top: 10px;
      min-height: 19px;
      font-weight: 500;
      line-height: 1.4;
    }
    .input-hint.error { color: var(--error); font-weight: 700; }
    .input-hint.ok    { color: var(--ok);    font-weight: 700; }

    /* ── Score ───────────────────────────────────────────── */
    .score-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 16px;
    }
    .score-badge {
      background: var(--orange);
      color: #fff;
      font-weight: 800;
      font-size: 24px;
      border-radius: 999px;
      padding: 10px 18px;
      line-height: 1;
      min-width: 60px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
    .score-sub { font-size: 13px; color: var(--muted); font-weight: 600; }
    .score-meta { display: flex; align-items: center; gap: 12px; }
    .restart-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 999px;
      width: 44px;
      height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: manipulation;
      transition:
        background var(--dur-fast) var(--ease-out),
        color var(--dur-fast) var(--ease-out),
        border-color var(--dur-fast) var(--ease-out),
        transform 100ms var(--ease-out);
    }
    .restart-btn:hover { color: var(--dark); background: var(--pink); border-color: transparent; }
    .restart-btn:active { transform: scale(0.92); }
    .best-chip {
      display: inline-flex; align-items: center; gap: 6px;
      font-family: var(--ff-sans);
      font-size: 12px; font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .best-chip strong { color: var(--dark); font-weight: 800; letter-spacing: 0; text-transform: none; font-size: 13px; }
    .new-best-banner {
      position: relative;
      display: block;
      width: 100%;
      background: linear-gradient(135deg, var(--orange), #F9B68A);
      color: #fff;
      padding: 14px 20px;
      border-radius: 999px;
      border: none;
      font-family: var(--ff-sans);
      font-weight: 800;
      font-size: 14px;
      letter-spacing: 0.04em;
      text-align: center;
      margin-top: 14px;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 120ms var(--ease-out), filter 150ms var(--ease-out), box-shadow 200ms var(--ease-out);
      box-shadow: 0 1px 0 rgba(0,0,0,0.04);
      animation: fadeIn 400ms var(--ease-out);
    }
    .new-best-banner:hover  { filter: brightness(1.05); box-shadow: 0 6px 18px -8px rgba(244,136,112,0.55); }
    .new-best-banner:active { transform: scale(0.98); }
    .burst-emoji {
      position: absolute;
      top: 50%; left: 50%;
      font-size: 40px;
      line-height: 1;
      pointer-events: none;
      animation: emojiBurst var(--burst-dur, 900ms) var(--ease-out) both;
      will-change: transform, opacity;
      z-index: 2;
    }

    /* ── Chain ───────────────────────────────────────────── */
    .chain-scroll {
      display: flex;
      flex-direction: column;
      gap: 5px;
      max-height: 200px;
      overflow-y: auto;
      overscroll-behavior: contain;
    }
    .chain-row {
      display: flex;
      align-items: center;
      gap: 6px;
      animation: slideDown 180ms ease;
    }
    .chain-tile {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: var(--cream);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      font-weight: 800;
      color: var(--dark);
      flex-shrink: 0;
    }
    .chain-tile.changed { background: #FFE8DC; color: #B85540; }
    .chain-pts { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: 0.01em; }

    /* countdown integrated into timer row — no separate overlay */

    /* ── Pos legend ──────────────────────────────────────── */
    .pos-legend { display: flex; flex-direction: column; gap: 8px; }
    .pos-item { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 500; color: var(--muted); }
    .pos-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

    /* ── Start / hero ────────────────────────────────────── */
    .start-hero {
      background: transparent;
      border-radius: 0;
      padding: 24px 0 0;
      margin-top: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    /* Horizontal logo lockup on mobile.
       SVG mascots have ~10–18% transparent padding around the visual,
       so gap is intentionally tight — pulls the wordmark close to the
       actual mascot silhouette, not the SVG bounding box. */
    .hero-mark {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .hero-mark .hero-wordmark { margin-top: 2px; } /* optical alignment vs mascot */
    .hero-wordmark {
      font-family: var(--ff-serif);
      font-size: 52px;
      font-weight: 600;
      letter-spacing: 0;
      line-height: 0.95;
      text-align: center;
    }
    .hero-wordmark .accent {
      color: var(--accent);
      font-family: inherit;
      font-weight: inherit;
      font-style: inherit;
    }
    .hero-tag {
      font-family: var(--ff-sans);
      font-size: 17px;
      font-weight: 400;
      color: var(--muted);
      margin-top: 14px;
      text-align: center;
      line-height: 1.4;
      max-width: 32ch; /* prevents a lonely orphan word on wide screens */
    }

    /* Desktop: stacked hero, larger mascot — reverts to the original
       vertical lockup that reads better with the extra real estate. */
    @media (min-width: 640px) {
      .start-hero { padding: 28px 0 0; }
      .hero-mark {
        flex-direction: column;
        gap: 8px;
      }
      .hero-mark .hero-wordmark { margin-top: 0; }
      .hero-mark img { width: 120px !important; height: 120px !important; }
      .hero-wordmark { font-size: 72px; letter-spacing: 0; line-height: 1; }
      .hero-tag { font-size: 18px; margin-top: 12px; }
    }

    /* ── Onboarding ──────────────────────────────────────── */
    .onboard-arrow {
      font-size: 28px;
      color: var(--border);
      text-align: center;
      margin: 8px 0;
      letter-spacing: 4px;
    }
    .onboard-success {
      text-align: center;
      animation: successBounce 400ms cubic-bezier(0.34,1.56,0.64,1) both;
      padding: 16px 0 8px;
    }
    .onboard-success-emoji { font-size: 48px; line-height: 1; }
    .onboard-success-title { font-size: 22px; font-weight: 800; margin-top: 8px; }
    .onboard-success-sub { font-size: 14px; color: var(--muted); margin-top: 4px; font-weight: 500; }

    /* confetti dots */
    .confetti-wrap {
      position: relative;
      height: 0;
      overflow: visible;
      pointer-events: none;
    }
    .confetti-dot {
      position: absolute;
      width: 8px; height: 8px;
      border-radius: 50%;
      animation: confettiFall 800ms ease-out both;
    }

    /* ── Dead-end banner ─────────────────────────────────── */
    .dead-end-banner {
      margin-top: 16px;
      background: #FFF3CD;
      border: 1.5px solid #F0C040;
      border-radius: 999px;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      animation: slideDown 220ms ease;
    }
    .dead-end-title { color: #7A5800; }
    .dead-end-sub   { color: #9A7010; }

    /* ── End screen ──────────────────────────────────────── */
    .end-score {
      font-size: 72px;
      font-weight: 800;
      line-height: 1;
      text-align: center;
      letter-spacing: -2px;
      font-variant-numeric: tabular-nums;
    }
    .end-score-label { font-size: 14px; font-weight: 600; color: var(--muted); text-align: center; margin-top: 6px; }
    .share-copied {
      font-size: 12px;
      color: var(--ok);
      font-weight: 700;
      text-align: center;
      margin-top: 6px;
      animation: fadeIn 200ms ease;
    }

    /* ── Preferences rows ────────────────────────────────── */
    .prefs-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .prefs-row:last-child { margin-bottom: 0; }
    .prefs-label { font-size: 14px; font-weight: 600; }
    .prefs-sub { font-size: 12px; color: var(--muted); margin-top: 2px; line-height: 1.4; }
    /* Toggle — 44px tall label for touch target, track centred within.
       Knob is hardcoded white (not --cream) so it doesn't blend into the
       colored-bg landing where --cream is overridden. */
    .toggle { position: relative; width: 48px; height: 44px; flex-shrink: 0; display: flex; align-items: center; }
    .toggle input { opacity: 0; position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
    .toggle-track {
      position: absolute;
      top: 50%; left: 0;
      transform: translateY(-50%);
      width: 48px; height: 24px;
      background: rgba(0,0,0,0.18); border-radius: 999px;
      pointer-events: none; /* input overlay handles clicks */
      transition: background 200ms;
    }
    .toggle input:checked + .toggle-track { background: var(--accent); }
    .toggle-track::after {
      content: '';
      position: absolute;
      top: 3px; left: 3px;
      width: 18px; height: 18px;
      background: #fff; border-radius: 50%;
      box-shadow: 0 1px 4px rgba(0,0,0,0.22);
      transition: transform 200ms;
    }
    .toggle input:checked + .toggle-track::after { transform: translateX(24px); }
    /* Dark mode — track + knob both adapt so they don't disappear */
    :root[data-theme="dark"] .toggle-track { background: rgba(255,255,255,0.18); }
    :root[data-theme="dark"] .toggle-track::after { background: #2A2826; box-shadow: 0 1px 4px rgba(0,0,0,0.6); }
    :root[data-theme="dark"] .toggle input:checked + .toggle-track::after { background: #fff; }
    /* On colored bg, bump the off-track darkness so it stays visible */
    :root[data-exp-colored-bg="1"] .toggle-track { background: rgba(0,0,0,0.22); }

    /* ── Keyboard hint ───────────────────────────────────── */
    .kbd-hint { text-align: center; font-size: 12px; color: var(--muted); margin-top: 10px; }
    kbd {
      background: var(--cream); border: 1px solid var(--border);
      border-radius: 5px; padding: 1px 5px;
      font-family: var(--ff); font-size: 11px; font-weight: 700;
    }
    .forever-badge {
      background: var(--dark); color: var(--cream);
      font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
      padding: 4px 10px; border-radius: 999px;
    }

    /* ── Chain scroll ────────────────────────────────────── */
    /* overscroll-behavior: contain keeps momentum inside the list, not the body */

    /* ── Mode picker ─────────────────────────────────────── */
    .mode-section-label {
      font-family: var(--ff-sans);
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .mode-picker {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .mode-pill {
      padding: 18px;
      border-radius: 16px;
      border: 1px solid #E5E5E5;
      background: #FAFAFA;
      font-family: var(--ff-sans);
      cursor: pointer;
      transition:
        background var(--dur-base) var(--ease-out),
        color var(--dur-base) var(--ease-out),
        border-color var(--dur-base) var(--ease-out),
        box-shadow var(--dur-base) var(--ease-out);
      color: var(--dark);
      text-align: left;
      line-height: 1.3;
      touch-action: manipulation;
    }
    .mode-pill:hover:not(.active) { background: #F5F5F5; }
    .mode-pill:active { transform: scale(0.98); }
    .mode-pill.active {
      background: var(--dark);
      color: #fff;
      border-color: var(--dark);
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.1);
      /* removed scale to avoid 1px nudges in adjacent UI */
    }
    .mode-pill-title { font-weight: 600; font-size: 22px; }
    .mode-pill-sub   {
      font-size: 14px;
      margin-top: 6px;
      color: var(--muted);
      font-family: var(--ff-sans);
    }
    .mode-pill.active .mode-pill-sub { color: rgba(255,255,255,0.78); }

    /* ── Info card (1px border — passive/informational) ──── */
    .info-card {
      background: #FAFAFA;
      border-radius: 16px;
      padding: 22px 22px 24px;
      border: 1px solid #E5E5E5;
    }
    .info-card-title {
      font-family: var(--ff-sans);
      font-size: 17px;
      font-weight: 600;
      color: var(--dark);
      margin-bottom: 18px;
      letter-spacing: -0.01em;
    }
    .info-list { display: flex; flex-direction: column; gap: 14px; }
    .info-list-row { display: flex; align-items: flex-start; gap: 14px; }
    .info-list-text {
      font-family: var(--ff-sans);
      font-size: 15px;
      line-height: 1.5;
      padding-top: 2px;
      color: var(--dark);
    }
    .info-num {
      width: 26px; height: 26px;
      border-radius: 50%;
      background: rgba(244,136,112,0.14);
      color: #F48870;
      font-size: 13px; font-weight: 700;
      display: inline-flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    /* ── Preferences toggle button ───────────────────────── */
    .prefs-toggle-btn {
      background: transparent; border: none; cursor: pointer;
      color: var(--muted); display: flex; align-items: center; gap: 6px;
      font-family: var(--ff-sans); font-size: 14px; font-weight: 500;
      padding: 12px 0; width: 100%; transition: color 150ms; /* 12px gives ≥44px tap height */
      touch-action: manipulation;
    }
    .prefs-toggle-btn:hover { color: var(--dark); }

    /* ── Focus styles ────────────────────────────────────── */
    :focus { outline: none; }
    :focus-visible {
      outline: 3px solid var(--orange);
      outline-offset: 2px;
      border-radius: 4px;
    }
    .btn:focus-visible      { outline-offset: 3px; border-radius: 16px; }
    .btn-sm:focus-visible   { border-radius: 10px; }
    .mode-pill:focus-visible { outline-offset: 3px; border-radius: 16px; }
    .toggle input:focus-visible + .toggle-track {
      outline: 3px solid var(--orange);

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;

    /* ── Theme transitions ───────────────────────────────── */
    body,
    .card, .info-card, .dead-end-banner, kbd,
    .chain-tile, .chain-tile.changed,

      transition: background-color 300ms ease, border-color 300ms ease, color 300ms ease;
    }
    /* tile already has its own transition — extend it for dark mode */
    .tile { transition: border-color 200ms ease, background-color 200ms ease, color 200ms ease; }

    /* ── Dark mode ───────────────────────────────────────── */
    :root[data-theme="dark"] {
      --cream:  #16140F;
      --white:  #1F1D17;
      --dark:   #F6F2EB;
      --muted:  #A8A29A;

    :root[data-theme="dark"] .mode-pill:hover:not(.active) { background: #252422; }
    :root[data-theme="dark"] .mode-pill.active { background: #F5F5F4; color: #141413; border-color: #F5F5F4; }
    :root[data-theme="dark"] .chain-tile.changed { background: rgba(236,105,74,0.20); color: #F4A88E; }
    :root[data-theme="dark"] .tile { border-color: rgba(255,255,255,0.18); }
    :root[data-theme="dark"] .tile.wrong { background: #3A1A16; }
    :root[data-theme="dark"] { --tutorial-accent: #8FB6E0; --tutorial-accent-bg: rgba(134,187,239,0.15); }
    :root[data-theme="dark"] .tile.changed-ok { background: var(--tutorial-accent-bg); border-color: var(--tutorial-accent); color: var(--tutorial-accent); }
    :root[data-theme="dark"] .dead-end-banner { background: #252010; border-color: #5A4A18; color: #D4B860; }
    :root[data-theme="dark"] .dead-end-banner .dead-end-title { color: #D4B860; }
    :root[data-theme="dark"] .dead-end-banner .dead-end-sub   { color: #A89040; }

    /* ── On-screen keyboard ──────────────────────────────── */
    /* Wordle-style virtual keyboard. Fixed at the bottom on touch
       devices so we control layout — no iOS autofill bar, no
       scroll hacks, tile area always visible above the keys. */
    .kb {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 8px 6px calc(8px + env(safe-area-inset-bottom));
      background: var(--cream);
      border-top: 1px solid var(--border);
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      z-index: 100;
    }
    .kb-row {
      display: flex;
      gap: 4px;
      justify-content: center;
      max-width: 500px;
      margin: 0 auto;
      width: 100%;
    }
    .kb-key {
      flex: 1 1 0;
      min-width: 0;
      height: 58px;
      border: none;
      border-radius: 8px;
      background: var(--white);
      color: var(--dark);
      font-family: var(--ff-sans);
      font-size: 19px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
      transition: transform 80ms ease, background 80ms ease, color 80ms ease;
    }
    .kb-key:active {
      background: var(--orange);
      color: #fff;
      transform: scale(0.94);
    }
    .kb-key.wide {
      flex: 1.6 1 0;
      font-size: 13px;
      letter-spacing: 0.05em;
    }
    :root[data-theme="dark"] .kb { background: #141413; border-top-color: rgba(255,255,255,0.1); }
    :root[data-theme="dark"] .kb-key { background: #2A2826; color: #F5F5F4; box-shadow: none; }
    /* Reserve space below content ONLY when the on-screen keyboard is mounted.
       Using :has() so the start/end screens don't get a phantom 230px gap. */
    @media (hover: none) and (pointer: coarse) {
      body:has(.kb) { padding-bottom: 230px; }
    }

    /* ── Mobile polish ───────────────────────────────────── */
    @media (max-width: 380px) {
      .hero-wordmark { font-size: 44px; letter-spacing: 0; }
      .hero-mark { gap: 4px; }
      .hero-mark img { width: 68px !important; height: 68px !important; }
      .tile { width: 56px; height: 56px; font-size: 24px; }
      .card { padding: 22px 20px; }

    @media (max-width: 320px) {

      .hero-wordmark { font-size: 34px; }
      .wordmark { font-size: 30px; } /* game/end screen header — prevents overflow next to 72px mascot */
      .info-card { padding: 16px; } /* reclaim horizontal space for tiles */
    }
  </style>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useContext, createContext, useMemo } = React;

/* ── Color overrides context ──────────────────────────── */
/* Provided by App, consumed by AnimatedMascot so the pig/bean
   SVG body can be re-colored live from the floating color picker. */
const ColorOverrideContext = createContext({});

/* useColoredSvg — synchronously generates a data: URI with the body
   fill substituted, using the inline SVG_DATA loaded from svg-data.js.
   Returns the original path if no override is requested.

   Why inline instead of fetch / <object>:
   - Chrome blocks fetch() on file:// pages
   - Chrome's file:// origin policy treats every file as a unique origin,
     so <object>.contentDocument is also blocked
   Embedding SVG text directly in JS sidesteps both. */
function useColoredSvg(path, defaultColor, accent) {
  return useMemo(() => {
    if (!accent || accent.toLowerCase() === defaultColor.toLowerCase()) {
      return path;
    }
    const source = (typeof SVG_DATA !== 'undefined') && SVG_DATA[path];
    if (!source) return path; // safety fallback
    const recolored = source.replace(
      new RegExp(`fill\\s*:\\s*${defaultColor}`, 'gi'),
      `fill: ${accent}`
    );
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(recolored);
  }, [path, defaultColor, accent]);
}

/* ── Constants ────────────────────────────────────────── */
const TOTAL_TIME   = 60;
const HEAD_START   = 4;
const MSG_DURATION = 2000;
const POS_COLORS   = ['#E8632B','#9B59B6','#2E86C1','#27AE60'];
const POS_EMOJI    = ['🟧','🟪','🟦','🟩'];

/* ── Mode configs ─────────────────────────────────────── */
const MODES = {
  classic: {
    id: 'classic',
    name: 'Soar Boar',
    sub: '4-letter words',
    wordLen: 4,
    duration: 60,
    getWords:    () => WORDS,
    getStarters: () => STARTER_WORDS,
    posPts:      [1, 4, 3, 2],
    posLabels:   ['1st','2nd','3rd','4th'],
    tutorialStart:  'SOAR',
    tutorialTarget: 'BOAR',
    tutorialWords:  ['SOAR', 'BOAR', 'BEAR'],
    tutorialHints:  ['Type BOAR, then press enter', 'Now type BEAR, then press enter'],
  },
  soyboy: {
    id: 'soyboy',
    name: 'Soy Boy',
    sub: '3-letter words',
    wordLen: 3,
    duration: 45,
    getWords:    () => WORDS3,
    getStarters: () => STARTER_WORDS3,
    posPts:      [1, 3, 2],
    posLabels:   ['1st','2nd','3rd'],
    tutorialStart:  'SOY',
    tutorialTarget: 'BOY',
    tutorialWords:  ['SOY', 'BOY', 'BAY'],
    tutorialHints:  ['Type BOY, then press enter', 'Now type BAY, then press enter'],
  },
};

/* Detect touch device — used to show/hide keyboard hints */
const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

const BEST_KEY = (modeId) => `bestScore:${modeId}`;
const getBestScore = (modeId) => {
  const n = parseInt(localStorage.getItem(BEST_KEY(modeId)) || '0', 10);
  return Number.isFinite(n) ? n : 0;
};
const setBestScore = (modeId, score) => localStorage.setItem(BEST_KEY(modeId), String(score));

const SHARE_URL = 'soarboar.com';

/* ── Helpers ──────────────────────────────────────────── */
function diffPos(a, b) {
  const d = [];
  for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) d.push(i);
  return d;
}

function randomStarter(modeId = 'classic') {
  const cfg = MODES[modeId];
  const words = cfg.getWords();
  const pool = cfg.getStarters().map(w => w.toUpperCase()).filter(w => words.has(w));
  return pool.length ? pool[Math.floor(Math.random() * pool.length)] : cfg.tutorialStart;
}

function getValidMoves(word, used, streakPos, streakCount, streakRule, words) {
  const moves = [];
  for (let i = 0; i < word.length; i++) {
    if (streakRule && streakPos === i && streakCount >= 2) continue;
    for (let c = 0; c < 26; c++) {
      const letter = String.fromCharCode(65 + c);
      if (letter === word[i]) continue;
      const cand = word.slice(0, i) + letter + word.slice(i + 1);
      if (words.has(cand) && !used.has(cand)) moves.push(cand);
    }
  }
  return moves;
}

function generateShareText(chain, score, modeId = 'classic') {
  const cfg = MODES[modeId];
  const neutral = '⬜';
  // First row: all neutral (the starting word)
  const rows = [neutral.repeat(cfg.wordLen)];
  for (let i = 1; i < chain.length; i++) {
    const diffs = diffPos(chain[i - 1].word, chain[i].word);
    const pos   = diffs[0];
    const row   = Array.from({ length: cfg.wordLen }, (_, j) =>
      j === pos ? POS_EMOJI[pos] : neutral
    ).join('');
    rows.push(row);
  }
  return [
    `${modeId === 'soyboy' ? '🫛' : '🐷'} ${cfg.name}`,
    `⏱ ${cfg.duration} sec · ${score} pts · ${chain.length - 1} word${chain.length !== 2 ? 's' : ''}`,
    '',
    ...rows,
    '',
    `▶ Beat my score → ${SHARE_URL}`,
  ].join('\n');
}

      {/* Curly vine tip */}

function MascotIcon({ size = 48, modeId = 'classic' }) {
  const [isDark, setIsDark] = useState(() =>
    document.documentElement.dataset.theme === 'dark'
  );
  useEffect(() => {
    const check = () => setIsDark(document.documentElement.dataset.theme === 'dark');
    const obs = new MutationObserver(check);
    obs.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
    return () => obs.disconnect();
  }, []);
  const dm  = isDark ? '-dark' : '';
  const src = modeId === 'soyboy' ? `bean-open${dm}.svg` : `pig-open${dm}.svg`;
  return <img src={src} width={size} height={size} alt="" style={{ display: 'block' }} />;
}

function Toggle({ checked, onChange, label }) {
  return (
    <label className="toggle" aria-label={label}>
      <input type="checkbox" checked={checked} onChange={e => onChange(e.target.checked)} aria-label={label} />
      <span className="toggle-track" />
    </label>
  );
}

function PosLegend({ modeId = 'classic' }) {
  const cfg = MODES[modeId];
  const labels = cfg.posPts.map((pts, i) => `${cfg.posLabels[i]} letter — ${pts} pt${pts !== 1 ? 's' : ''}`);
  return (
    <div className="pos-legend">
      {labels.map((label, i) => (
        <div key={i} className="pos-item">
          <div className="pos-dot" style={{ background: POS_COLORS[i] }} />
          {label}
        </div>
      ))}
    </div>
  );
}

function ChainRows({ chain, maxHeight = 200, modeId = 'classic' }) {
  const cfg = MODES[modeId];
  return (
    <div className="chain-scroll" style={{ maxHeight }}>
      {chain.slice().reverse().map((entry, i) => {
        const idx   = chain.length - 1 - i;
        const prev  = idx > 0 ? chain[idx - 1].word : null;
        const diffs = prev ? diffPos(prev, entry.word) : [];
        return (
          <div key={idx} className="chain-row">
            {entry.word.split('').map((l, j) => (
              <div key={j} className={`chain-tile${diffs.includes(j) ? ' changed' : ''}`}>{l}</div>
            ))}
            {entry.pts != null && (
              <span className="chain-pts">+{entry.pts} · {prev && diffs.length === 1 && cfg.posLabels[diffs[0]]} letter</span>
            )}
          </div>
        );
      })}
    </div>
  );
}

/* ── Confetti burst ───────────────────────────────────── */
function Confetti() {
  const dots = Array.from({ length: 12 }, (_, i) => ({
    color: POS_COLORS[i % 4],
    left: `${(i / 11) * 100}%`,
    delay: `${(i * 60) % 400}ms`,
    size: 6 + (i % 3) * 3,
  }));
  return (
    <div className="confetti-wrap">
      {dots.map((d, i) => (
        <div
          key={i}
          className="confetti-dot"
          style={{
            background: d.color,
            left: d.left,
            width: d.size, height: d.size,
            animationDelay: d.delay,
            top: -10,
          }}
        />
      ))}
    </div>
  );
}

/* ── OnboardingScreen ─────────────────────────────────── */
/* ── On-screen keyboard (touch only) ───────────────────── */
const KB_ROWS = [
  ['Q','W','E','R','T','Y','U','I','O','P'],
  ['A','S','D','F','G','H','J','K','L'],
  ['ENTER','Z','X','C','V','B','N','M','⌫'],
];
function Keyboard({ onKey, visible = true }) {
  if (!isTouchDevice || !visible) return null;
  const dispatch = (k) => {
    if (k === 'ENTER')      onKey('Enter');
    else if (k === '⌫')      onKey('Backspace');
    else                     onKey(k);
  };
  return (
    <div className="kb" role="group" aria-label="On-screen keyboard">
      {KB_ROWS.map((row, ri) => (
        <div key={ri} className="kb-row">
          {row.map(k => (
            <button
              key={k}
              type="button"
              className={`kb-key${k === 'ENTER' || k === '⌫' ? ' wide' : ''}`}
              onPointerDown={e => { e.preventDefault(); dispatch(k); }}
              aria-label={k === '⌫' ? 'Backspace' : k === 'ENTER' ? 'Enter' : k}
            >{k}</button>
          ))}
        </div>
      ))}
    </div>
  );
}

function OnboardingScreen({ onDone, onBack, modeId = 'classic' }) {
  const cfg   = MODES[modeId];
  const words = cfg.tutorialWords;   // e.g. ['SOAR','BOAR','BEAR']
  // On mobile, submit is via the on-screen ENTER key; on desktop it's the physical enter
  const submitLabel = isTouchDevice ? 'tap ENTER' : 'press enter';
  const hints = cfg.tutorialHints.map(h => h.replace('press enter', submitLabel));

  const [step,           setStep]           = useState(0);
  const [typed,          setTyped]          = useState('');
  const [msg,            setMsg]            = useState({ text: '', type: '' });
  const [shaking,        setShaking]        = useState(false);
  const [completedSteps, setCompletedSteps] = useState([]); // [{word, pts, changedIdx}]
  const [done,           setDone]           = useState(false);
  const typedRef  = useRef('');
  const msgTimer  = useRef(null);

  const fromWord = words[step];

  const showMsg = useCallback((text, type) => {
    clearTimeout(msgTimer.current);
    setMsg({ text, type });
    msgTimer.current = setTimeout(() => setMsg({ text:'', type:'' }), MSG_DURATION);
  }, []);

  const handleKeyDown = useCallback((e) => {
    if (done) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const tryShake = () => { setShaking(true); setTimeout(() => setShaking(false), 280); };
    const attemptSubmit = (word) => {
      if (word.length !== cfg.wordLen) return;
      if (!cfg.getWords().has(word)) { showMsg('Not a word', 'error'); tryShake(); return; }
      const diffs = diffPos(fromWord, word);
      if (diffs.length === 0) { showMsg('Same word — change one letter!', 'error'); tryShake(); return; }
      if (diffs.length > 1)  { showMsg('Change exactly one letter', 'error'); tryShake(); return; }
      const changedIdx = diffs[0];
      const pts = cfg.posPts[changedIdx];
      const newCompleted = [...completedSteps, { word, pts, changedIdx }];
      setCompletedSteps(newCompleted);
      const nextStep = step + 1;
      if (nextStep >= words.length - 1) {
        setDone(true);
      } else {
        setStep(nextStep);
        typedRef.current = ''; setTyped('');
        setMsg({ text: '', type: '' });
      }
    };
    if (e.key === 'Enter') {
      attemptSubmit(typedRef.current);
    } else if (e.key === 'Backspace') {
      const next = typedRef.current.slice(0, -1);
      typedRef.current = next; setTyped(next);
      setMsg({ text:'', type:'' });
    } else if (/^[a-zA-Z]$/.test(e.key) && typedRef.current.length < cfg.wordLen) {
      const next = typedRef.current + e.key.toUpperCase();
      typedRef.current = next; setTyped(next);
      if (next.length === cfg.wordLen) attemptSubmit(next);
    }
  }, [done, step, fromWord, completedSteps, showMsg, cfg, words.length]);

  useEffect(() => {
    window.addEventListener('keydown', handleKeyDown);
    return () => window.removeEventListener('keydown', handleKeyDown);
  }, [handleKeyDown]);

  const typedDiffs      = typed.length === cfg.wordLen ? diffPos(fromWord, typed) : [];
  const tooMany         = typedDiffs.length > 1;
  const persistentError = tooMany ? `Changed ${typedDiffs.length} letters — change just 1` : '';
  const displayMsg      = persistentError ? { text: persistentError, type: 'error' } : msg;
  const totalPts        = completedSteps.reduce((s, x) => s + x.pts, 0);

  return (
    <div className="stagger">

      {/* Back nav */}
      <div style={{ paddingTop: 20, paddingBottom: 4 }}>
        <button
          onClick={onBack}
          style={{
            background: 'none', border: 'none', cursor: 'pointer',
            display: 'inline-flex', alignItems: 'center', gap: 6,
            fontFamily: 'var(--ff-sans)', fontSize: 14, fontWeight: 500,
            color: 'var(--muted)', padding: '12px 0', /* 44px tap height */
            touchAction: 'manipulation',
          }}
        >

/* ── AnimatedMascot ───────────────────────────────────── */
function AnimatedMascot({ size = 120, modeId = 'classic' }) {
  const [isBlinking,    setIsBlinking]    = useState(false);
  const [isFlapping,    setIsFlapping]    = useState(false);
  const [isDark,        setIsDark]        = useState(false);
  const [renderDark,    setRenderDark]    = useState(false);
  const [mascotOpacity, setMascotOpacity] = useState(1);
  const [coloredBgActive, setColoredBgActive] = useState(
    () => document.documentElement.dataset.expColoredBg === '1'
  );
  const prevDarkRef = useRef(false);
  const overrides = useContext(ColorOverrideContext);

  // Track dark mode + colored-bg changes
  useEffect(() => {
    const check = () => {
      setIsDark(document.documentElement.dataset.theme === 'dark');
      setColoredBgActive(document.documentElement.dataset.expColoredBg === '1');
    };
    check();
    const obs = new MutationObserver(check);
    obs.observe(document.documentElement, {
      attributes: true,
      attributeFilter: ['data-theme', 'data-exp-colored-bg'],
    });
    return () => obs.disconnect();
  }, []);

  // Crossfade when dark mode toggles
  useEffect(() => {
    if (prevDarkRef.current === isDark) return;
    prevDarkRef.current = isDark;
    setMascotOpacity(0);
    const t = setTimeout(() => { setRenderDark(isDark); setMascotOpacity(1); }, 180);
    return () => clearTimeout(t);
  }, [isDark]);

  const isClassic = modeId !== 'soyboy';
  const dm = renderDark ? '-dark' : '';
  const openPath   = isClassic ? `pig-open${dm}.svg`   : `bean-open${dm}.svg`;
  const closedPath = isClassic ? `pig-closed${dm}.svg` : `bean-closed${dm}.svg`;

  // Re-color from picker — only when coloredBg is active for the screen.
  // defaultColor MUST match the fill currently in the SVG file.
  const defaultColor = isClassic ? '#EC694A' : '#27885E';
  const modeKey = isClassic ? 'classic' : 'soyboy';
  const accent = coloredBgActive ? (overrides[modeKey] || {}).accent : null;
  const openSrc   = useColoredSvg(openPath,   defaultColor, accent);
  const closedSrc = useColoredSvg(closedPath, defaultColor, accent);

  useEffect(() => {
    // Blink: ~25% chance every 2s
    const blinkId = setInterval(() => {
      if (Math.random() < 0.25) {
        setIsBlinking(true);
        setTimeout(() => setIsBlinking(false), 150);
      }
    }, 2000);
    // Flap: ~20% chance every 3s, single play
    const flapId = setInterval(() => {
      if (Math.random() < 0.20) {
        setIsFlapping(true);
        setTimeout(() => setIsFlapping(false), 500);
      }
    }, 3000);
    return () => { clearInterval(blinkId); clearInterval(flapId); };
  }, [modeId]);

  return (
    <img
      src={isBlinking ? closedSrc : openSrc}
      width={size}
      height={size}
      style={{
        display: 'block',
        animation: isFlapping ? 'earFlap 500ms ease' : 'none',
        opacity: mascotOpacity,
        transition: 'opacity 180ms ease',
        transformOrigin: 'center bottom',
      }}
      alt=""
    />
  );
}

/* Default colors used by the floating color picker. */
const DEFAULT_COLORS = {
  classic: { bg: '#FFD1A8', accent: '#EC694A' },
  soyboy:  { bg: '#B7D197', accent: '#27885E' },
};

/* ── Color math ───────────────────────────────────────── */
function hexToRgb(hex) {
  const h = hex.replace('#','');
  if (h.length !== 6) return { r: 0, g: 0, b: 0 };
  return {
    r: parseInt(h.slice(0,2), 16),
    g: parseInt(h.slice(2,4), 16),
    b: parseInt(h.slice(4,6), 16),
  };
}
function rgbToHex({ r, g, b }) {
  const c = (n) => Math.round(Math.max(0, Math.min(255, n))).toString(16).padStart(2,'0');
  return '#' + c(r) + c(g) + c(b);
}
function rgbToHsv({ r, g, b }) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r,g,b), min = Math.min(r,g,b);
  const d = max - min;
  let h = 0;
  const s = max === 0 ? 0 : d / max;
  const v = max;
  if (d !== 0) {
    if (max === r) h = ((g - b) / d) % 6;
    else if (max === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60;
    if (h < 0) h += 360;
  }
  return { h, s: s * 100, v: v * 100 };
}
function hsvToRgb({ h, s, v }) {
  s /= 100; v /= 100;
  const c = v * s;
  const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
  const m = v - c;
  let r = 0, g = 0, b = 0;
  if      (h <  60) { r = c; g = x; }
  else if (h < 120) { r = x; g = c; }
  else if (h < 180) { g = c; b = x; }
  else if (h < 240) { g = x; b = c; }
  else if (h < 300) { r = x; b = c; }
  else              { r = c; b = x; }
  return { r: (r + m) * 255, g: (g + m) * 255, b: (b + m) * 255 };
}
const hexToHsv = (hex) => rgbToHsv(hexToRgb(hex));
const hsvToHex = (hsv) => rgbToHex(hsvToRgb(hsv));

/* ── HsvPicker ────────────────────────────────────────── */
/* Inline drag-to-pick color picker. 2D SL pad on top, hue slider below,
   hex input at the bottom. Pointer events with window-level capture
   so dragging stays live even when the pointer leaves the element. */
function HsvPicker({ value, onChange }) {
  const safe = (typeof value === 'string' && /^#[0-9a-fA-F]{6}$/.test(value)) ? value : '#000000';
  const [hsv, setHsv] = useState(() => hexToHsv(safe));
  const [hexDraft, setHexDraft] = useState(safe.toUpperCase());
  const padRef = useRef(null);
  const hueRef = useRef(null);
  const dragRef = useRef(null);
  const internalHexRef = useRef(safe.toUpperCase());

  // Sync from external value when it changes (e.g. swatch switch).
  useEffect(() => {
    if (value && value.toUpperCase() !== internalHexRef.current) {
      const next = hexToHsv(safe);
      setHsv(next);
      setHexDraft(safe.toUpperCase());
      internalHexRef.current = safe.toUpperCase();
    }
  }, [value]);

  const commitHsv = (next) => {
    setHsv(next);
    const hex = hsvToHex(next).toUpperCase();
    setHexDraft(hex);
    internalHexRef.current = hex;
    onChange(hex);
  };

  const handlePad = (clientX, clientY) => {
    const r = padRef.current.getBoundingClientRect();
    const x = Math.max(0, Math.min(1, (clientX - r.left) / r.width));
    const y = Math.max(0, Math.min(1, (clientY - r.top)  / r.height));
    commitHsv({ ...hsv, s: x * 100, v: (1 - y) * 100 });
  };
  const handleHue = (clientX) => {
    const r = hueRef.current.getBoundingClientRect();
    const x = Math.max(0, Math.min(1, (clientX - r.left) / r.width));
    commitHsv({ ...hsv, h: x * 360 });
  };

  useEffect(() => {
    const onMove = (e) => {
      if (!dragRef.current) return;
      e.preventDefault();
      if (dragRef.current === 'pad') handlePad(e.clientX, e.clientY);
      if (dragRef.current === 'hue') handleHue(e.clientX);
    };
    const onUp = () => { dragRef.current = null; };
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
    return () => {
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      window.removeEventListener('pointercancel', onUp);
    };
  });

  const padDown = (e) => {
    e.preventDefault();
    dragRef.current = 'pad';
    handlePad(e.clientX, e.clientY);
  };
  const hueDown = (e) => {
    e.preventDefault();
    dragRef.current = 'hue';
    handleHue(e.clientX);
  };

  const onHexChange = (e) => {
    let v = e.target.value;
    if (v && v[0] !== '#') v = '#' + v;
    setHexDraft(v.toUpperCase());
    if (/^#[0-9a-fA-F]{6}$/.test(v)) {
      const next = hexToHsv(v);
      setHsv(next);
      internalHexRef.current = v.toUpperCase();
      onChange(v.toUpperCase());
    }
  };

  return (
    <div>
      <div
        className="hsv-pad"
        ref={padRef}
        onPointerDown={padDown}
        style={{
          background:
            'linear-gradient(to top, #000, transparent), ' +
            'linear-gradient(to right, #fff, transparent), ' +
            `hsl(${hsv.h}, 100%, 50%)`,
        }}
      >
        <div
          className="hsv-pad-marker"
          style={{
            left: `${hsv.s}%`,
            top: `${100 - hsv.v}%`,
            background: hsvToHex(hsv),
          }}
        />
      </div>
      <div
        className="hsv-hue"
        ref={hueRef}
        onPointerDown={hueDown}
      >
        <div className="hsv-hue-marker" style={{ left: `${(hsv.h / 360) * 100}%` }} />
      </div>
      <div className="hsv-hex-row">
        <input
          type="text"
          className="hsv-hex"
          value={hexDraft}
          onChange={onHexChange}
          spellCheck={false}
          autoComplete="off"
          maxLength={7}
        />
      </div>
    </div>
  );
}

/* ── FloatingColorPicker ─────────────────────────────── */
function FloatingColorPicker({ colorOverrides, setColorOverrides, modeId }) {
  const [open, setOpen] = useState(true);
  const [activeKey, setActiveKey] = useState(() => `${modeId}.bg`);
  const [copied, setCopied] = useState(false);

  // When mode changes, focus the active swatch on the new mode if helpful
  useEffect(() => {
    const [m] = activeKey.split('.');
    if (m !== 'classic' && m !== 'soyboy') return;
    // Optionally re-target to current mode's bg when user switches mode
    setActiveKey(prev => {
      const [mm, kk] = prev.split('.');
      return mm === modeId ? prev : `${modeId}.${kk}`;
    });
  }, [modeId]);

  const get = (m, k) =>
    (colorOverrides[m] && colorOverrides[m][k]) || DEFAULT_COLORS[m][k];
  const isOverride = (m, k) =>
    !!(colorOverrides[m] && colorOverrides[m][k]);

  const updateActive = (hex) => {
    const [m, k] = activeKey.split('.');
    setColorOverrides(prev => ({
      ...prev,
      [m]: { ...(prev[m] || {}), [k]: hex },
    }));
  };

  const reset = () => setColorOverrides({});
  const copy = () => {
    const text =
`Classic — bg: ${get('classic','bg')}  accent: ${get('classic','accent')}
Soyboy  — bg: ${get('soyboy','bg')}   accent: ${get('soyboy','accent')}`;
    navigator.clipboard.writeText(text).then(() => {
      setCopied(true);
      setTimeout(() => setCopied(false), 1800);
    }).catch(() => {});
  };

  if (!open) {
    return (
      <button
        className="cp-fab"
        onClick={() => setOpen(true)}
        aria-label="Open color tool"
        title="Color tool"
      >
        🎨
      </button>
    );
  }

  const swatches = [
    { key: 'classic.bg',     label: 'Soar Boar BG' },
    { key: 'classic.accent', label: 'Soar Boar Accent' },
    { key: 'soyboy.bg',      label: 'Soy Boy BG' },
    { key: 'soyboy.accent',  label: 'Soy Boy Accent' },
  ];
  const [activeMode, activeKind] = activeKey.split('.');
  const currentValue = get(activeMode, activeKind);

  return (
    <div className="cp-floating" role="dialog" aria-label="Color tool">
      <div className="cp-header">
        <span className="cp-title">Color tool</span>
        <button className="cp-close" onClick={() => setOpen(false)} aria-label="Close">×</button>
      </div>

      <div className="cp-swatches">
        {swatches.map(s => {
          const [m, k] = s.key.split('.');
          const v = get(m, k);
          const isActive = s.key === activeKey;
          return (
            <button
              key={s.key}
              type="button"
              className={`cp-swatch${isActive ? ' active' : ''}`}
              onClick={() => setActiveKey(s.key)}
            >
              <span className="cp-swatch-color" style={{ background: v }} />
              <span className="cp-swatch-text">
                <span className="cp-swatch-label">{s.label}</span>
                <span className="cp-swatch-hex" style={{
                  color: isOverride(m, k) ? v : 'inherit',
                  fontWeight: isOverride(m, k) ? 700 : 600,
                }}>{v.toUpperCase()}</span>
              </span>
            </button>
          );
        })}
      </div>

      <HsvPicker value={currentValue} onChange={updateActive} />

      <div className="cp-actions">
        <button type="button" className="cp-btn" onClick={reset}>Reset</button>
        <button type="button" className="cp-btn primary" onClick={copy}>
          {copied ? 'Copied ✓' : 'Copy values'}
        </button>
      </div>
    </div>
  );
}
