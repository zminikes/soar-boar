              className={`mode-pill${modeId === m.id ? ' active' : ''}`}
              onClick={() => setModeId(m.id)}
              aria-pressed={modeId === m.id}
            >
              <div className="mode-pill-title">{m.name}</div>
              <div className="mode-pill-sub">{m.sub} · {m.duration} sec</div>
            </button>
          ))}
        </div>
        {bestScore > 0 && (
          <div style={{ textAlign: 'center', marginTop: 14 }}>
            <span className="best-chip">Personal best · <strong>{bestScore} pts</strong></span>
          </div>
        )}
      </div>

      {/* How it works — first-time players only.
         Once someone has a personal best in this mode, they've learned. */}
      {bestScore === 0 && (
        <div style={{ marginTop: 16 }}>
          <div className="info-card">
            <div className="info-card-title">How it works</div>
            <div className="info-list">
              {howItWorks.map((text, i) => (
                <div key={i} className="info-list-row">
                  <div className="info-num">{i + 1}</div>
                  <div className="info-list-text">{text}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      {/* CTA buttons */}
      <div style={{ marginTop: 16, display: 'flex', flexDirection: 'column', gap: 10 }}>
        <button className="btn btn-primary btn-full" onClick={onStart}>
          <svg width="20" height="20" viewBox="0 0 16 16" fill="white" style={{ flexShrink: 0 }} aria-hidden="true">
            <polygon points="3,2 14,8 3,14"/>
          </svg>
          Start playing
        </button>
        <button
          className="btn btn-ghost btn-full"
          onClick={onTutorial}
        >
          Show me how to play
        </button>
      </div>

      {/* Preferences toggle */}
      <div style={{ marginTop: 8, textAlign: 'center' }}>
        <button
          className="prefs-toggle-btn"
          style={{ justifyContent: 'center' }}
          onClick={() => setShowPrefs(p => !p)}
          aria-expanded={showPrefs}
        >
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
          {showPrefs ? 'Hide' : 'Show'} preferences
        </button>
      </div>

      {/* Preferences panel */}
      {showPrefs && (
        <div className="info-card" style={{ animation: 'slideDown 200ms ease', marginTop: 12 }}>
          <div className="info-card-title">Preferences</div>
          {[
            { key: 'streakRule',  label: 'Position streak rule', sub: 'Prevents changing same position 3x in a row' },
            { key: 'foreverMode', label: 'Practice mode',        sub: 'No timer, play at your own pace' },
            { key: 'darkMode',    label: 'Dark mode',            sub: 'Easy on the eyes' },
          ].map(({ key, label, sub }) => (
            <div key={key} className="prefs-row">
              <div><div className="prefs-label">{label}</div><div className="prefs-sub">{sub}</div></div>
              <Toggle checked={debug[key]} onChange={v => setDebug(d => ({ ...d, [key]: v }))} label={label} />
            </div>
          ))}
          {debugMode && <ExperimentsPanel debug={debug} setDebug={setDebug} />}
        </div>
      )}

    </div>
  );
}

/* ── PlayScreen ───────────────────────────────────────── */
function PlayScreen({ onEnd, onHome, onRestart, debug, modeId = 'classic' }) {
  const cfg = MODES[modeId];
  const [phase,       setPhase]       = useState('countdown');
  const [countdown,   setCountdown]   = useState(HEAD_START);
  const [currentWord, setCurrentWord] = useState('');
  const [typed,       setTyped]       = useState('');
  const [usedWords,   setUsedWords]   = useState(() => new Set());
  const [chain,       setChain]       = useState([]);
  const [score,       setScore]       = useState(0);
  const [timeLeft,    setTimeLeft]    = useState(cfg.duration);
  const [msg,         setMsg]         = useState({ text: '', type: '' });
  const [shaking,     setShaking]     = useState(false);
  const [acceptKey,   setAcceptKey]   = useState(0);
  const [deadEnd,     setDeadEnd]     = useState(false);

  const typedRef     = useRef('');
  const currentRef   = useRef('');
  const usedRef      = useRef(new Set());
  const streakPosRef = useRef(null);
  const streakCntRef = useRef(0);
  const scoreRef     = useRef(0);
  const chainRef     = useRef([]);
  const phaseRef     = useRef('countdown');
  const gameOverRef  = useRef(false);
  const msgTimer     = useRef(null);

  useEffect(() => { currentRef.current = currentWord; }, [currentWord]);
  useEffect(() => { phaseRef.current   = phase; },       [phase]);

  useEffect(() => {
    const start = randomStarter(modeId);
    const s = new Set([start]);
    currentRef.current = start;
    usedRef.current    = s;
    chainRef.current   = [{ word: start, pts: null }];
    setCurrentWord(start);
    setUsedWords(s);
    setChain([{ word: start, pts: null }]);
  }, []);

  // Countdown
  useEffect(() => {
    if (phase !== 'countdown') return;
    const id = setInterval(() => {
      setCountdown(c => {
        if (c <= 1) { clearInterval(id); setPhase('playing'); phaseRef.current = 'playing'; return 0; }
        return c - 1;
      });
    }, 1000);
    return () => clearInterval(id);
  }, [phase]);

  // Timer
  useEffect(() => {
    if (phase !== 'playing' || debug.foreverMode) return;
    const id = setInterval(() => {
      setTimeLeft(t => {
        if (t <= 1) {
          clearInterval(id);
          gameOverRef.current = true;
          setTimeout(() => onEnd({ score: scoreRef.current, chain: chainRef.current, deadEnd: false }), 300);
          return 0;
        }
        return t - 1;
      });
    }, 1000);
    return () => clearInterval(id);
  }, [phase, debug.foreverMode, onEnd]);

  const showMsg = useCallback((text, type) => {
    clearTimeout(msgTimer.current);
    setMsg({ text, type });
    msgTimer.current = setTimeout(() => setMsg({ text:'', type:'' }), MSG_DURATION);
  }, []);

  const triggerShake = useCallback(() => {
    setShaking(true);
    setTimeout(() => setShaking(false), 320);
  }, []);

  const submitWord = useCallback((word) => {
    if (gameOverRef.current) return;
    const upper = word.toUpperCase();
    const cur   = currentRef.current;
    if (!cfg.getWords().has(upper)) { showMsg('Not a word', 'error'); triggerShake(); return; }
    const diffs = diffPos(cur, upper);
    if (diffs.length !== 1) {
      showMsg(diffs.length === 0 ? 'Same as current word' : 'Change exactly one letter', 'error');
      triggerShake(); return;
    }
    if (usedRef.current.has(upper)) { showMsg('Already used', 'error'); triggerShake(); return; }
    const pos = diffs[0];
    let newStreakCnt = (streakPosRef.current === pos) ? streakCntRef.current + 1 : 1;
    if (debug.streakRule && newStreakCnt >= 3) {
      showMsg(`Can't change position ${pos + 1} three times in a row`, 'error');
      triggerShake(); return;
    }
    const pts      = cfg.posPts[pos];
    const newScore = scoreRef.current + pts;
    const newUsed  = new Set([...usedRef.current, upper]);
    const newChain = [...chainRef.current, { word: upper, pts }];
    scoreRef.current    = newScore;
    usedRef.current     = newUsed;
    chainRef.current    = newChain;
    streakPosRef.current = pos;
    streakCntRef.current = newStreakCnt;
    typedRef.current = '';
    setTyped('');
    setCurrentWord(upper);
    setUsedWords(newUsed);
    setChain(newChain);
    setScore(newScore);
    setAcceptKey(k => k + 1);
    showMsg(`+${pts} pt${pts !== 1 ? 's' : ''}`, 'ok');
    const moves = getValidMoves(upper, newUsed, pos, newStreakCnt, debug.streakRule, cfg.getWords());
    if (moves.length === 0) {
      setDeadEnd(true);
      if (debug.foreverMode) {
        gameOverRef.current = true;
        setTimeout(() => onEnd({ score: newScore, chain: newChain, deadEnd: true }), 1800);
      }
    }
  }, [debug.streakRule, debug.foreverMode, showMsg, triggerShake, onEnd]);

  const handleKeyDown = useCallback((e) => {
    if (gameOverRef.current) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (phaseRef.current === 'countdown' && /^[a-zA-Z]$/.test(e.key)) {
      setPhase('playing'); phaseRef.current = 'playing';
    }
    if (phaseRef.current !== 'playing') return;
    if (e.key === 'Enter') {
      if (typedRef.current.length === cfg.wordLen) submitWord(typedRef.current);
    } else if (e.key === 'Backspace') {
      const next = typedRef.current.slice(0, -1);
      typedRef.current = next; setTyped(next);
      setMsg({ text:'', type:'' });
    } else if (/^[a-zA-Z]$/.test(e.key) && typedRef.current.length < cfg.wordLen) {
      const next = typedRef.current + e.key.toUpperCase();
      typedRef.current = next; setTyped(next);
      if (next.length === cfg.wordLen) submitWord(next);
    }
  }, [submitWord, cfg]);

  useEffect(() => {
    window.addEventListener('keydown', handleKeyDown);
    return () => window.removeEventListener('keydown', handleKeyDown);
  }, [handleKeyDown]);

  // Real-time validation
  const typedDiffs      = typed.length === cfg.wordLen ? diffPos(currentWord, typed) : [];
  const tooMany         = typedDiffs.length > 1;
  const noChange        = typedDiffs.length === 0 && typed.length === cfg.wordLen;
  const persistentError = tooMany
    ? `Changed ${typedDiffs.length} letters — change just 1`
    : noChange ? 'Same as current word' : '';
  const displayMsg = persistentError ? { text: persistentError, type: 'error' } : msg;

  const urgent      = timeLeft <= 10 && !debug.foreverMode;
  const pct         = debug.foreverMode ? 100 : (timeLeft / cfg.duration) * 100;
  const wordsPlayed = chain.length - 1;

  return (
    <div className="stagger">
      <div
        className="hdr"
        onClick={onHome}
        onKeyDown={e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onHome(); } }}
        role="button"
        tabIndex={0}
        aria-label="Back to home"
      >
        <MascotIcon size={72} modeId={cfg.id} />
        <div className="wordmark">{cfg.name.split(' ')[0]} <span className="accent">{cfg.name.split(' ')[1]}</span></div>
        {debug.foreverMode && <span className="forever-badge">∞</span>}
      </div>

      {!debug.foreverMode && (
        <div className="timer-wrap">
          <div className="timer-row">
            <span className="timer-label">
              {phase === 'countdown' ? 'Starting in' : 'Time left'}
            </span>
            <span className={`timer-secs${urgent ? ' urgent' : ''}`}>
              {phase === 'countdown' ? countdown : timeLeft}s
            </span>
          </div>
          <div className={`timer-track${urgent ? ' urgent' : ''}`}>
            <div className={`timer-fill${urgent ? ' urgent' : ''}${phase === 'countdown' ? ' paused' : ''}`}
              style={{ width: `${pct}%` }} />
          </div>
        </div>
      )}

      <div className="score-row">
        <div className="score-badge">{score}</div>
        <div className="score-meta">
          <div className="score-sub">{wordsPlayed} word{wordsPlayed !== 1 ? 's' : ''} played</div>
          <button
            type="button"
            className="restart-btn"
            onClick={onRestart}
            aria-label="Restart game"
            title="Restart"
          >
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
              <polyline points="23 4 23 10 17 10"/>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
            </svg>
          </button>
        </div>
      </div>

      <div style={{ marginTop: 20 }}>
        <div className="section-label">Current word</div>
        <div className="tile-row">
          {currentWord.split('').map((l, i) => (
            <div key={`${acceptKey}-${i}`} className="tile accept" style={{ animationDelay: `${i * 40}ms` }}>{l}</div>
          ))}
        </div>
      </div>

      {deadEnd && (
        <div className="dead-end-banner">
          <span style={{ fontSize: 20 }}>{modeId === 'soyboy' ? '🫛' : '🐷'}</span>
          <div>
            <div className="dead-end-title" style={{ fontSize: 13, fontWeight: 800 }}>Dead end!</div>
            <div className="dead-end-sub" style={{ fontSize: 12, marginTop: 2 }}>
              No valid moves left from <strong>{currentWord}</strong>.
              {debug.foreverMode ? ' Ending game…' : ' Wait for the timer.'}
            </div>
          </div>
        </div>
      )}

      <div style={{ marginTop: 16, opacity: deadEnd ? 0.4 : 1, pointerEvents: deadEnd ? 'none' : 'auto' }}>
        <div className="section-label">Your next word</div>
        <div className={`tile-row${shaking ? ' shake' : ''}`}>
          {Array.from({ length: cfg.wordLen }, (_, i) => {
            const letter   = typed[i] || '';
            const isCursor = i === typed.length && typed.length < cfg.wordLen;
            const isWrong  = (tooMany || noChange) && typedDiffs.includes(i);
            return (
              <div key={i} className={`tile${isCursor ? ' cursor' : ''}${isWrong ? ' wrong' : ''}`}>{letter}</div>
            );
          })}
        </div>
        <div className={`input-hint ${displayMsg.type}`}>{displayMsg.text || '\u00a0'}</div>
        {!isTouchDevice && (
          <div className="kbd-hint">type · <kbd>⌫</kbd> delete · <kbd>↵</kbd> submit</div>
        )}
      </div>

      {chain.length > 1 && (
        <div style={{ marginTop: 20 }}>
          <div className="section-label">Word chain</div>
          <ChainRows chain={chain} modeId={modeId} />
        </div>
      )}

      <Keyboard onKey={k => handleKeyDown({ key: k })} visible={!deadEnd} />
    </div>
  );
}

/* ── EndScreen ────────────────────────────────────────── */
function EndScreen({ score, chain, deadEnd, onRestart, onHome, debug, modeId = 'classic' }) {
  const cfg = MODES[modeId];
  const [copied, setCopied] = useState(false);
  const wordsPlayed = chain.length - 1;

  // Best score: only tracked for timed runs (foreverMode is endless / different scoring).
  // Persisted to localStorage via setBestScore -> see BEST_KEY('classic'|'soyboy').
  const previousBest = useRef(getBestScore(modeId)).current;
  const isNewBest = !debug.foreverMode && score > 0 && score > previousBest;
  useEffect(() => {
    if (isNewBest) setBestScore(modeId, score);
  }, [isNewBest, modeId, score]);
  const currentBest = isNewBest ? score : previousBest;

  // Emoji burst on tapping the new-best banner
  const [bursts, setBursts] = useState([]);
  const burstId = useRef(0);
  const handleBurst = useCallback(() => {
    const emojis = modeId === 'soyboy' ? ['🫛'] : ['🐷', '🪽'];
    const id = ++burstId.current;
    const N = 14;
    const particles = Array.from({ length: N }, (_, i) => {
      const angle = (i / N) * 360 + (Math.random() * 24 - 12);
      const dist  = 130 + Math.random() * 110;
      const rad   = (angle * Math.PI) / 180;
      return {
        emoji: emojis[i % emojis.length],
        dx: Math.cos(rad) * dist,
        dy: Math.sin(rad) * dist,
        rot: (Math.random() - 0.5) * 720,
        dur: 900 + Math.random() * 500,
      };
    });
    setBursts(prev => [...prev, { id, particles }]);
    setTimeout(() => setBursts(prev => prev.filter(b => b.id !== id)), 1500);
  }, [modeId]);

  const handleShare = useCallback(async () => {
    const text = generateShareText(chain, score, modeId);
    try {
      if (navigator.share) {
        await navigator.share({ text });
      } else {
        await navigator.clipboard.writeText(text);
        setCopied(true);
        setTimeout(() => setCopied(false), 2500);
      }
    } catch (_) {
      try {
        await navigator.clipboard.writeText(text);
        setCopied(true);
        setTimeout(() => setCopied(false), 2500);
      } catch (_) {}
    }
  }, [chain, score, modeId]);

  return (
    <div className="stagger">
      <div
        className="hdr"
        onClick={onHome}
        onKeyDown={e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onHome(); } }}
        role="button"
        tabIndex={0}
        aria-label="Back to home"
      >
        <MascotIcon size={72} modeId={cfg.id} />
        <div className="wordmark">{cfg.name.split(' ')[0]} <span className="accent">{cfg.name.split(' ')[1]}</span></div>
      </div>

      {/* Score readout */}
      <div style={{ marginTop: 24, textAlign: 'center' }}>
        <div className="end-score">{debug.foreverMode ? wordsPlayed : score}</div>
        <div className="end-score-label">
          {debug.foreverMode
            ? `${wordsPlayed} word${wordsPlayed !== 1 ? 's' : ''} in chain`
            : `${wordsPlayed} word${wordsPlayed !== 1 ? 's' : ''} · ${score} point${score !== 1 ? 's' : ''}`}
        </div>
        {deadEnd && (
          <div className="dead-end-sub" style={{ fontSize: 13, textAlign: 'center', marginTop: 6 }}>
            {`Ended on a dead end ${modeId === 'soyboy' ? '🫛' : '🐷'}`}
          </div>
        )}
        {!debug.foreverMode && isNewBest && (
          <button
            type="button"
            className="new-best-banner"
            onClick={handleBurst}
            aria-label="Celebrate new personal best"
          >
            🏆 New personal best!
            {bursts.map(burst => (
              <React.Fragment key={burst.id}>
                {burst.particles.map((p, i) => (
                  <span
                    key={i}
                    className="burst-emoji"
                    aria-hidden="true"
                    style={{
                      '--burst-dx':  `${p.dx}px`,
                      '--burst-dy':  `${p.dy}px`,
                      '--burst-rot': `${p.rot}deg`,
                      '--burst-dur': `${p.dur}ms`,
                    }}
                  >{p.emoji}</span>
                ))}
              </React.Fragment>
            ))}
          </button>
        )}
        {!debug.foreverMode && !isNewBest && currentBest > 0 && (
          <div style={{ marginTop: 12 }}>
            <span className="best-chip">Personal best · <strong>{currentBest} pts</strong></span>
          </div>
        )}
      </div>

      {/* Chain */}
      <div style={{ marginTop: 28 }}>
        <div className="section-label">Your chain</div>
        <ChainRows chain={chain} maxHeight={260} modeId={modeId} />
      </div>

      {/* Actions */}
      <div style={{ marginTop: 28, display: 'flex', flexDirection: 'column', gap: 10 }}>
        <button className="btn btn-primary btn-full" onClick={onRestart}>Play again</button>
        {!debug.foreverMode && (
          <button className="btn btn-copy btn-full" onClick={handleShare}>
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
            </svg>
            {navigator.share ? 'Share chain' : 'Copy chain'}
          </button>
        )}
        {copied && <div className="share-copied">Copied to clipboard! ✓</div>}
      </div>
    </div>
  );
}

/* ── App ──────────────────────────────────────────────── */
function App() {
  // screen: 'start' | 'tutorial' | 'playing' | 'end'
  const [screen,  setScreen]  = useState('start');
  const [result,  setResult]  = useState(null);
  const [playKey, setPlayKey] = useState(0);
  const restart = () => { setPlayKey(k => k + 1); setScreen('playing'); };
  const [debug,   setDebug]   = useState(() => ({
    streakRule:    true,
    foreverMode:   false,
    darkMode:      localStorage.getItem('darkMode') === 'true',
    /* Design experiments — flip these to A/B compare directions. */
    simpleLanding: localStorage.getItem('exp:simpleLanding') === 'true',
    coloredBg:     localStorage.getItem('exp:coloredBg') === 'true',
  }));
  const [modeId,  setModeId]  = useState('classic');

  /* Debug mode — gates the design-experiments panel and the floating
     color picker. Toggle on/off via:
     - URL parameter:  ?debug=1  /  ?debug=0
     - Keyboard:       Cmd/Ctrl + Shift + D
     Persists in localStorage so once enabled it stays enabled. */
  const [debugMode, setDebugMode] = useState(() => {
    try {
      const params = new URLSearchParams(window.location.search);
      if (params.has('debug')) {
        const val = params.get('debug') === '1';
        localStorage.setItem('debugMode', String(val));
        return val;
      }
    } catch (_) {}
    return localStorage.getItem('debugMode') === 'true';
  });
  useEffect(() => {
    localStorage.setItem('debugMode', String(debugMode));
  }, [debugMode]);
  useEffect(() => {
    const onKey = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.shiftKey && e.key.toLowerCase() === 'd') {
        e.preventDefault();
        setDebugMode(d => !d);
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  // Color picker overrides — live tweak bg + accent per mode, write to a
  // dynamic <style> tag so changes apply without reload.
  const [colorOverrides, setColorOverrides] = useState(() => {
    try { return JSON.parse(localStorage.getItem('colorOverrides')) || {}; }
    catch { return {}; }
  });
  useEffect(() => {
    let styleEl = document.getElementById('color-overrides');
    if (!styleEl) {
      styleEl = document.createElement('style');
      styleEl.id = 'color-overrides';
      document.head.appendChild(styleEl);
    }
    const cls = colorOverrides.classic || {};
    const soy = colorOverrides.soyboy  || {};
    styleEl.textContent = [
      cls.bg     && `:root[data-exp-colored-bg="1"][data-exp-mode="classic"] { --cream: ${cls.bg}; }`,
      cls.accent && `:root[data-exp-colored-bg="1"][data-exp-mode="classic"] { --deep-peach: ${cls.accent}; --accent: ${cls.accent}; }`,
      soy.bg     && `:root[data-exp-colored-bg="1"][data-exp-mode="soyboy"]  { --cream: ${soy.bg}; }`,
      soy.accent && `:root[data-exp-colored-bg="1"][data-exp-mode="soyboy"]  { --deep-sage: ${soy.accent}; --accent: ${soy.accent}; }`,
    ].filter(Boolean).join('\n');
    localStorage.setItem('colorOverrides', JSON.stringify(colorOverrides));
  }, [colorOverrides]);

  useEffect(() => {
    document.documentElement.dataset.theme = debug.darkMode ? 'dark' : '';
    localStorage.setItem('darkMode', debug.darkMode);
    // Keep browser chrome (status bar / address bar) in sync with app background.
    // Adjusted further below when coloredBg is on.
    const tc = document.querySelector('meta[name="theme-color"]');
    if (tc) tc.setAttribute('content', debug.darkMode ? '#16140F' : '#F8F1E5');
  }, [debug.darkMode]);

  // Persist experiments + apply body-level classes that drive CSS variables.
  // Colored bg is intentionally scoped to the start screen only — game/end keep cream.
  useEffect(() => {
    localStorage.setItem('exp:simpleLanding', String(debug.simpleLanding));
    localStorage.setItem('exp:coloredBg',     String(debug.coloredBg));
    const coloredBgActive = debug.coloredBg && (screen === 'start' || screen === 'tutorial');
    document.documentElement.dataset.expColoredBg = coloredBgActive ? '1' : '';
    document.documentElement.dataset.expMode = modeId;
    // Keep iOS status-bar color in sync with whatever bg is showing
    const tc = document.querySelector('meta[name="theme-color"]');
    if (tc) {
      if (coloredBgActive) {
        const bg = debug.darkMode
          ? (modeId === 'soyboy' ? '#1C2823' : '#3A1F18')
          : (modeId === 'soyboy' ? '#B7D197' : '#FFD1A8');
        tc.setAttribute('content', bg);
      } else {
        tc.setAttribute('content', debug.darkMode ? '#16140F' : '#F8F1E5');
      }
    }
  }, [debug.simpleLanding, debug.coloredBg, debug.darkMode, modeId, screen]);

  return (
    <ColorOverrideContext.Provider value={colorOverrides}>
    <div id="root" className={modeId === 'soyboy' ? 'soyboy' : ''}>
      {screen === 'start' && (
        debug.simpleLanding ? (
          <SimplifiedStartScreen
            onStart={restart}
            onTutorial={() => setScreen('tutorial')}
            debug={debug}
            setDebug={setDebug}
            modeId={modeId}
            setModeId={setModeId}
            debugMode={debugMode}
          />
        ) : (
          <StartScreen
            onStart={restart}
            onTutorial={() => setScreen('tutorial')}
            debug={debug}
            setDebug={setDebug}
            modeId={modeId}
            setModeId={setModeId}
            debugMode={debugMode}
          />
        )
      )}
      {screen === 'tutorial' && (
        <OnboardingScreen
          modeId={modeId}
          onDone={restart}
          onBack={() => setScreen('start')}
        />
      )}
      {screen === 'playing' && (
        <PlayScreen
          key={playKey}
          onEnd={res => { setResult(res); setScreen('end'); }}
          onHome={() => setScreen('start')}
          onRestart={restart}
          debug={debug}
          modeId={modeId}
        />
      )}
      {screen === 'end' && (
        <EndScreen
          score={result.score}
          chain={result.chain}
          deadEnd={result.deadEnd}
          debug={debug}
          modeId={modeId}
          onRestart={restart}
          onHome={() => setScreen('start')}
        />
      )}
      {debugMode && debug.coloredBg && (screen === 'start' || screen === 'tutorial') && (
        <FloatingColorPicker
          colorOverrides={colorOverrides}
          setColorOverrides={setColorOverrides}
          modeId={modeId}
        />
      )}
      {debugMode && (
        <DebugBadge enabled={debugMode} onToggle={() => setDebugMode(false)} />
      )}
    </div>
    </ColorOverrideContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
