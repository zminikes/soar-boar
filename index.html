<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F8F1E5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Change one letter at a time to build the longest word ladder you can. Race the clock — 60 seconds to score big."
    />
    <title>Soar Boar — The word-ladder game</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐷</text></svg>"
    />

    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Soar Boar — The word-ladder game" />
    <meta
      property="og:description"
      content="Change one letter at a time to build the longest word ladder you can. Race the clock — 60 seconds to score big."
    />
    <meta property="og:url" content="https://soarboar.com" />
    <meta property="og:image" content="https://soarboar.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Soar Boar — The word-ladder game" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Soar Boar — The word-ladder game" />
    <meta
      name="twitter:description"
      content="Change one letter at a time to build the longest word ladder you can."
    />
    <meta name="twitter:image" content="https://soarboar.com/og-image.png" />

    <!-- Fonts are self-hosted via @fontsource — see src/main.tsx.
         Display fonts for the start-screen wordmarks (Belanosima for the
         Soar Boar + Soy Boy wordmarks, Bagel Fat One for This That) are
         loaded from Google Fonts because @fontsource versions weren't
         added as deps for this pilot. If we keep these, run
         `npm i @fontsource/belanosima @fontsource/bagel-fat-one` and
         move them next to the other @fontsource imports in main.tsx. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Belanosima:wght@400;600;700&family=Bagel+Fat+One&display=block"
      rel="stylesheet"
    />

    <!-- Preload self-hosted display fonts so they're available when the
         start screen's wordmark renders. Without these the wordmark
         briefly hides (font-display: block) before flashing into the
         correct face — preload removes that wait. -->
    <link
      rel="preload"
      href="/fonts/SunlinerRevivalRegular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/HolidazeDisplayRegular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
